name: Verify app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # E2E는 실제 백엔드와 MySQL로 돌린다. 백엔드는 Playwright가 띄운다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: flexable
          MYSQL_USER: flexable
          MYSQL_PASSWORD: flexable
          MYSQL_ROOT_PASSWORD: flexable-root
        ports:
          - 13306:3306
    env:
      E2E_EXTERNAL_DB: '1'
      E2E_DB_PORT: '13306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: ./gradlew classes --quiet
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 러너에 Android SDK가 설치되어 있다 (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://10.0.2.2:8080
      - run: npx cap sync android
      - run: ./gradlew assembleDebug lintDebug --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: flex-able-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-lint-report
          path: android/app/build/reports/
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers가 러너의 Docker로 MySQL을 띄운다 (DB 지연 기동 · 재시작 복구 테스트 포함).
      - run: ./gradlew test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-report
          path: backend/build/reports/tests/
          retention-days: 7
