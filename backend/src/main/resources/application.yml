# 모든 값은 환경변수로 덮어쓸 수 있다. 기본값은 로컬 개발용이다.
spring:
  application:
    name: flexable-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/flexable?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:flexable}
    password: ${DB_PASSWORD:flexable}
    hikari:
      # DB가 없어도 프로세스는 뜬다. 연결은 요청 시점에 다시 시도한다.
      initialization-fail-timeout: -1
      # DB 장애 시 요청과 헬스체크가 오래 매달리지 않게 한다.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 2000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      # 부팅 중 JDBC 메타데이터를 읽지 않는다 (DB 없이 EntityManagerFactory 생성).
      hibernate.boot.allow_jdbc_metadata_access: false
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
      jakarta.persistence.database-product-name: MySQL
      jakarta.persistence.database-major-version: 8
      jakarta.persistence.database-minor-version: 4
      hibernate.jdbc.time_zone: Asia/Seoul
  jackson:
    deserialization:
      # Jackson 3 기본값은 생략된 원시 타입 필드(boolean 등)를 거부한다. 생략 시 기본값을 쓰고,
      # 필수 값은 Bean Validation이 필드 단위 오류로 알려준다.
      fail-on-null-for-primitives: false
  flyway:
    # 시작 시점 마이그레이션은 DB가 없으면 부팅을 실패시키므로 끈다.
    # SchemaMigrator가 백그라운드에서 재시도하며 실행한다.
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:never}
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,schema
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  cors:
    # Vite 개발 서버, 로컬 미리보기, Capacitor Android(https://localhost), iOS(capacitor://localhost)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,https://localhost,capacitor://localhost}
  schema:
    retry-initial-delay: ${SCHEMA_RETRY_INITIAL_DELAY:2s}
    retry-max-delay: ${SCHEMA_RETRY_MAX_DELAY:30s}
  auth:
    # Base64 HMAC-SHA256 키 (32바이트 이상). 운영에서는 반드시 지정한다: openssl rand -base64 32
    # 비우면 실행할 때마다 임시 키를 만들어서, 재시작하면 모든 access token이 무효가 된다.
    jwt-secret: ${AUTH_JWT_SECRET:}
    issuer: ${AUTH_ISSUER:flex-able}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:30d}
    refresh-cookie:
      name: flexable_refresh
      # localhost는 http여도 브라우저가 Secure 쿠키를 허용한다.
      secure: ${AUTH_COOKIE_SECURE:true}
      # 프론트와 API가 같은 사이트(포트만 다른 localhost 포함)면 Lax, 다른 사이트면 None(+ Secure)
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    login-throttle:
      max-failures: 5
      lock-duration: 15m
    # 같은 IP에서 1시간에 만들 수 있는 게스트(둘러보기) 계정 수
    guest-limit-per-hour: ${AUTH_GUEST_LIMIT_PER_HOUR:20}
